name: Create release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    env:
      GOOS: "linux"
      GOARCH: "amd64"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install webkit2gtk and libgtk-3-0
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build
          go build \
            -o "build/mdv-${TAG}-${GOOS}-${GOARCH}" \
            -ldflags="-s -w" \
            .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/* \
            --repo="$GITHUB_REPOSITORY" \
            --title="$TAG" \
            --generate-notes
