name: Create release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-linux:
    name: Release Linux
    runs-on: ubuntu-22.04
    env:
      GOOS: "linux"
      GOARCH: "amd64"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install webkit2gtk and libgtk-3-0
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build
          go build \
            -o "build/linux" \
            -ldflags="-s -w" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/linux

  release-win:
    name: Release Windows
    runs-on: windows-latest
    env:
      GOOS: "windows"
      GOARCH: "amd64"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile binary
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p build
          go build \
            -o "build/windows.exe" \
            -ldflags="-s -w" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/windows.exe

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [release-linux, release-win]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" linux/linux windows/windows.exe \
            --repo="$GITHUB_REPOSITORY" \
            --title="$TAG" \
            --generate-notes
